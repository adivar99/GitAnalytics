table:
  name: churn_metrics
  schema: public
object_relationships:
  - name: git_commit
    using:
      foreign_key_constraint_on: commit_hash
  - name: project
    using:
      foreign_key_constraint_on: project_id
insert_permissions:
  - role: administrator
    permission:
      check:
        project:
          company_id:
            _eq: X-Hasura-Company-Id
      columns:
        - commit_hash
        - lines_overwritten
        - id
        - project_id
        - perpetrator_email
        - victim_email
    comment: ""
  - role: manager
    permission:
      check:
        project:
          manager_user_id:
            _eq: X-Hasura-User-Id
      columns:
        - commit_hash
        - lines_overwritten
        - id
        - project_id
        - perpetrator_email
        - victim_email
    comment: ""
select_permissions:
  - role: administrator
    permission:
      columns:
        - commit_hash
        - lines_overwritten
        - id
        - project_id
        - perpetrator_email
        - victim_email
      filter:
        project:
          company_id:
            _eq: X-Hasura-Company-Id
    comment: ""
  - role: developer
    permission:
      columns:
        - commit_hash
        - lines_overwritten
        - id
        - project_id
        - perpetrator_email
        - victim_email
      filter:
        project:
          _or:
            - manager_user_id:
                _eq: X-Hasura-User-Id
            - project_members:
                user_id:
                  _eq: X-Hasura-User-Id
    comment: ""
  - role: guest
    permission:
      columns:
        - commit_hash
        - lines_overwritten
        - id
        - project_id
        - perpetrator_email
        - victim_email
      filter:
        project:
          project_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: GUEST
    comment: ""
  - role: manager
    permission:
      columns:
        - commit_hash
        - lines_overwritten
        - id
        - project_id
        - perpetrator_email
        - victim_email
      filter:
        project:
          manager_user_id:
            _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: administrator
    permission:
      columns:
        - commit_hash
        - lines_overwritten
        - id
        - project_id
        - perpetrator_email
        - victim_email
      filter:
        project:
          company_id:
            _eq: X-Hasura-Company-Id
      check: null
    comment: ""
delete_permissions:
  - role: administrator
    permission:
      filter:
        project:
          company_id:
            _eq: X-Hasura-Company-Id
    comment: ""
