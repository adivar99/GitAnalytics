table:
  name: project_members
  schema: public
object_relationships:
  - name: project
    using:
      foreign_key_constraint_on: project_id
  - name: user
    using:
      manual_configuration:
        column_mapping:
          user_id: id
        insertion_order: null
        remote_table:
          name: users
          schema: public
insert_permissions:
  - role: administrator
    permission:
      check: {}
      columns:
        - joined_at
        - role
        - id
        - project_id
        - user_id
    comment: ""
  - role: manager
    permission:
      check:
        project:
          manager_user_id:
            _eq: X-Hasura-User-Id
      columns:
        - joined_at
        - role
        - id
        - project_id
        - user_id
    comment: ""
select_permissions:
  - role: administrator
    permission:
      columns:
        - joined_at
        - role
        - id
        - project_id
        - user_id
      filter:
        project:
          company_id:
            _eq: X-Hasura-Company-Id
    comment: ""
  - role: developer
    permission:
      columns:
        - joined_at
        - role
        - id
        - project_id
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
  - role: manager
    permission:
      columns:
        - joined_at
        - role
        - id
        - project_id
        - user_id
      filter:
        project:
          manager_user_id:
            _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: administrator
    permission:
      columns:
        - joined_at
        - role
        - id
        - project_id
        - user_id
      filter:
        project:
          company_id:
            _eq: X-Hasura-Company-Id
      check: null
    comment: ""
  - role: manager
    permission:
      columns:
        - joined_at
        - role
        - id
        - project_id
        - user_id
      filter:
        project:
          manager_user_id:
            _eq: X-Hasura-User-Id
      check: null
    comment: ""
delete_permissions:
  - role: administrator
    permission:
      filter:
        project:
          company_id:
            _eq: X-Hasura-Company-Id
    comment: ""
  - role: manager
    permission:
      filter:
        project:
          manager_user_id:
            _eq: X-Hasura-User-Id
    comment: ""
