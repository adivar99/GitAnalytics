table:
  name: users
  schema: public
object_relationships:
  - name: company
    using:
      foreign_key_constraint_on: company_id
  - name: companyById
    using:
      foreign_key_constraint_on: id
array_relationships:
  - name: project_members
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: project_members
          schema: public
  - name: projects
    using:
      foreign_key_constraint_on:
        column: manager_user_id
        table:
          name: projects
          schema: public
insert_permissions:
  - role: administrator
    permission:
      check: {}
      columns:
        - email
        - full_name
        - password_hash
        - created_at
        - id
        - company_id
    comment: ""
select_permissions:
  - role: administrator
    permission:
      columns:
        - email
        - full_name
        - password_hash
        - created_at
        - id
        - company_id
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
    comment: ""
update_permissions:
  - role: administrator
    permission:
      columns:
        - email
        - full_name
        - password_hash
        - created_at
        - id
        - company_id
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      check: null
    comment: ""
delete_permissions:
  - role: administrator
    permission:
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
    comment: ""
